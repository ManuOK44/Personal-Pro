<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172337"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Personal Pro"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Personal Pro · Prestaciones</title><style>
:root{--bg:#f3f6fb;--surface:#fff;--surface2:#eef3fa;--text:#192439;--muted:#66758d;--stroke:#dce3ee;--accent:#3a65d5;--accentlight:#e9efff;--bad:#bc3c4a;--good:#15815e;--shadow:0 12px 36px #17233712}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#111924;--surface:#1a2635;--surface2:#233247;--text:#f1f5fd;--muted:#b1bfd0;--stroke:#334358;--accentlight:#253b65;--shadow:none}body.green{--accent:#168267;--accentlight:#e2f4ed}body.purple{--accent:#7752bd;--accentlight:#f0eafa}.shell{max-width:1060px;margin:auto;padding:24px 16px 110px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;display:grid;place-items:center;background:var(--accent);color:white;font-weight:850;border-radius:16px;font-size:20px}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.5}.muted,small{color:var(--muted)}small{font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--stroke);color:var(--muted);background:var(--surface);border-radius:12px;padding:11px 15px;font-weight:700}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.card{border:1px solid var(--stroke);border-radius:19px;background:var(--surface);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:17px}.stat strong{display:block;font-size:clamp(19px,3vw,29px);margin:9px 0 3px}.stat small{display:block}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--stroke);border-radius:11px;font:inherit;padding:12px;min-height:44px}input[type=date]{display:block;box-sizing:border-box;min-width:0;max-width:100%;width:100%;font-size:16px;padding:10px 12px}input[type=date]::-webkit-date-and-time-value{min-width:0;text-align:left}textarea{resize:vertical}button{cursor:pointer;font:inherit}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--accent);color:white}.btn.alt{background:var(--surface2);color:var(--text)}.btn.danger{background:#fbe9e9;color:#af2637}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;border-radius:50px;background:var(--accentlight);color:var(--accent);font-size:12px;font-weight:750;padding:6px 10px}.pill.off{color:var(--muted);background:var(--surface2)}.person{padding:15px 0;border-bottom:1px solid var(--stroke)}.person:last-child{border:0}.money{font-variant-numeric:tabular-nums}.big{font-size:29px;font-weight:850}.note{border-radius:12px;background:var(--surface2);padding:12px 15px;font-size:13px;line-height:1.5;color:var(--muted)}.hide{display:none!important}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:20}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px;padding:22px}.line{border-top:1px solid var(--stroke);margin:16px 0}.right{text-align:right}.empty{padding:35px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{min-width:0}.hidden-file{display:none}.intro{max-width:740px}.kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}@media(max-width:650px){.shell{padding:15px 12px 85px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}.card{padding:16px}.top h1{font-size:21px}.btn{padding:11px 12px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">PP</div><div><h1>Personal Pro</h1><small>Control laboral · México</small></div></div><button class="btn alt" id="themeBtn" title="Cambiar tema">◐ Tema</button></header><nav class="tabs" id="tabs"><button data-tab="inicio" class="tab active">Resumen</button><button data-tab="empleados" class="tab">Empleados</button><button data-tab="vacaciones" class="tab">Vacaciones</button><button data-tab="simulador" class="tab">Finiquitos</button><button data-tab="ajustes" class="tab">Ajustes</button></nav><section id="page"></section></main><div id="modalRoot"></div><input type="file" id="importFile" accept="application/json,.json" class="hidden-file"><script>
'use strict';const KEY='personal-pro-v1';const today=()=>new Date().toLocaleDateString('en-CA');const ymd=(d)=>{const x=new Date(d+'T12:00:00');return Number.isFinite(+x)?x:null};const stamp=(d)=>d.toLocaleDateString('en-CA');const diff=(a,b)=>Math.max(0,Math.round((ymd(b)-ymd(a))/86400000)+1);const addYear=(date,n)=>{let d=ymd(date);d.setFullYear(d.getFullYear()+n);return stamp(d)};const maxD=(a,b)=>a>b?a:b;const minD=(a,b)=>a<b?a:b;const fmt=(n)=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number.isFinite(n)?n:0);const num=(v)=>Math.max(0,Number(v)||0);const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let db={employees:[],theme:'light',accent:'blue',company:'Mi negocio'},tab='inicio',selected='',asof=today();try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.employees))db={...db,...old}}catch{}function save(){localStorage.setItem(KEY,JSON.stringify(db));}function daily(e){return num(e.salary)/({day:1,week:7,fortnight:15,month:30}[e.period]||7)}function annualDays(y){return y<=1?12:y<=5?10+y*2:20+2*Math.floor((y-1)/5)}function capEnd(e,date){return minD(date,e.endDate||date)}function activeOn(e,date){return e.start<=date&&(!e.endDate||e.endDate>=date)}function aguinaldo(e,date){const end=capEnd(e,date),start=maxD(e.start,date.slice(0,4)+'-01-01');if(end<start)return 0;const year=+date.slice(0,4),denom=(new Date(year,1,29).getMonth()===1?366:365);return daily(e)*num(e.bonusDays||15)*diff(start,end)/denom}function vacationAcc(e,date){let end=capEnd(e,date);if(end<e.start)return 0;let sum=0,ann=1,from=e.start;while(from<=end&&ann<130){let next=addYear(e.start,ann),last=stamp(new Date(ymd(next).getTime()-86400000));let covered=diff(from,minD(end,last));let len=diff(from,last);sum+=annualDays(ann)*covered/len;from=next;ann++}return sum}function vacationUsed(e,date){return (e.vacations||[]).filter(x=>x.date<=date).reduce((s,x)=>s+num(x.days),0)}function vacationLeft(e,date){return Math.max(0,vacationAcc(e,date)-vacationUsed(e,date))}function bonusPaid(e,date){return (e.bonusPayments||[]).filter(x=>x.date.slice(0,4)===date.slice(0,4)&&x.date<=date).reduce((s,x)=>s+num(x.amount),0)}function getEmployee(){return db.employees.find(e=>e.id===selected)}function render(){document.body.className=[db.theme==='dark'?'dark':'',db.accent==='green'?'green':'',db.accent==='purple'?'purple':''].join(' ');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let html='';if(tab==='inicio')html=renderHome();if(tab==='empleados')html=renderEmployees();if(tab==='vacaciones')html=renderVacations();if(tab==='simulador')html=renderSimulator();if(tab==='ajustes')html=renderSettings();document.getElementById('page').innerHTML=html;bind();}function renderHome(){const list=db.employees.filter(e=>activeOn(e,asof)),amount=list.reduce((s,e)=>s+Math.max(0,aguinaldo(e,asof)-bonusPaid(e,asof)),0),projected=db.employees.filter(e=>e.start<=asof.slice(0,4)+'-12-31'&&(!e.endDate||e.endDate>=asof.slice(0,4)+'-01-01')).reduce((s,e)=>s+Math.max(0,aguinaldo(e,asof.slice(0,4)+'-12-31')-bonusPaid(e,asof.slice(0,4)+'-12-31')),0);return `<div class="row wrap"><div><div class="kicker">Panel general</div><h2>${esc(db.company)}</h2></div><button class="btn" data-action="add">+ Agregar empleado</button></div><div class="card"><label for="asof">Fecha de consulta</label><input type="date" id="asof" value="${asof}"></div><div class="stats"><div class="card stat"><small>Personal activo</small><strong>${list.length}</strong><small>En esta fecha</small></div><div class="card stat"><small>Aguinaldo pendiente</small><strong class="money">${fmt(amount)}</strong><small>Acumulado estimado</small></div><div class="card stat"><small>Proyección a diciembre</small><strong class="money">${fmt(projected)}</strong><small>Menos pagos registrados</small></div></div><div class="card"><h2>Personal y prestaciones</h2>${db.employees.length?db.employees.map(e=>`<div class="person row wrap"><div><strong>${esc(e.name)}</strong><br><small>${esc(e.job||'Sin puesto')} · Ingreso ${esc(e.start)}</small></div><div class="right"><strong class="money">${fmt(Math.max(0,aguinaldo(e,asof)-bonusPaid(e,asof)))}</strong><br><small>Aguinaldo pendiente</small></div><button class="btn alt" data-open="${e.id}">Ver</button></div>`).join(''):'<div class="empty">Aún no hay empleados registrados. Agrega el primero para comenzar.</div>'}</div><p class="note">Los importes son estimaciones brutas. No incluyen impuestos, retenciones, incidencias, prestaciones contractuales especiales ni cálculos especializados por salario variable o trabajo discontinuo.</p>`}function renderEmployees(){return `<div class="row wrap"><h2>Empleados (${db.employees.length})</h2><button class="btn" data-action="add">+ Agregar empleado</button></div><div class="card"><input id="search" placeholder="Buscar por nombre o puesto"><div id="employeeList">${employeeRows('')}</div></div>`}function employeeRows(q){const items=db.employees.filter(x=>(x.name+' '+x.job).toLowerCase().includes(q.toLowerCase()));return items.length?items.map(e=>`<div class="person row wrap"><div><strong>${esc(e.name)}</strong> <span class="pill ${e.endDate?'off':''}">${e.endDate?'Baja':'Activo'}</span><br><small>${esc(e.job||'Sin puesto')} · ${fmt(daily(e))}/día · Alta ${esc(e.start)}</small></div><button class="btn alt" data-open="${e.id}">Abrir expediente</button></div>`).join(''):'<div class="empty">Sin resultados.</div>'}function renderVacations(){return `<h2>Vacaciones y prima vacacional</h2><div class="card"><label>Fecha de consulta</label><input id="asof" type="date" value="${asof}"><div class="line"></div>${db.employees.length?db.employees.map(e=>`<div class="person row wrap"><div><strong>${esc(e.name)}</strong><br><small>Acumulados ${vacationAcc(e,asof).toFixed(2)} · usados ${vacationUsed(e,asof).toFixed(2)} · disponibles ${vacationLeft(e,asof).toFixed(2)} días</small></div><div class="right"><strong>${fmt(vacationLeft(e,asof)*daily(e)*num(e.premium||25)/100)}</strong><br><small>Prima potencial sobre saldo</small></div><button class="btn alt" data-open="${e.id}">Registrar</button></div>`).join(''):'<div class="empty">Agrega empleados primero.</div>'}</div><p class="note">Los días acumulados son una aproximación contable distribuida proporcionalmente por aniversario. No equivalen a que se puedan pagar vacaciones durante la relación laboral. Para jornadas discontinuas y condiciones especiales se requiere una revisión particular.</p>`}function renderSimulator(){const e=getEmployee()||db.employees[0];if(e&&!selected)selected=e.id;return `<h2>Simulador de finiquito</h2>${!e?'<div class="card empty">Primero agrega al menos un empleado.</div>':`<div class="card stack"><div><label>Empleado</label><select id="simEmployee">${db.employees.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Fecha de salida o simulación</label><input type="date" id="simDate" value="${asof}" min="${e.start}"></div><div><label>Días de salario pendientes de pago</label><input type="number" id="pendingDays" min="0" step="0.5" value="0"></div><button class="btn" data-action="calc">Calcular finiquito estimado</button><div id="simResults"></div></div><div class="note">Esta herramienta calcula únicamente un finiquito básico estimado: salario pendiente, aguinaldo proporcional menos pagos registrados, vacaciones pendientes y prima vacacional sobre ellas. No calcula indemnización constitucional, prima de antigüedad, 20 días por año, salarios caídos ni liquidación por despido, porque dependen de circunstancias legales específicas. No sustituye asesoría laboral.</div>`}`}function renderSettings(){return `<h2>Ajustes y respaldos</h2><div class="card stack"><div><label>Nombre del negocio</label><input id="company" value="${esc(db.company)}" maxlength="100"></div><div><label>Apariencia</label><select id="theme"><option value="light" ${db.theme==='light'?'selected':''}>Claro</option><option value="dark" ${db.theme==='dark'?'selected':''}>Oscuro</option></select></div><div><label>Color principal</label><select id="accent"><option value="blue" ${db.accent==='blue'?'selected':''}>Azul</option><option value="green" ${db.accent==='green'?'selected':''}>Verde</option><option value="purple" ${db.accent==='purple'?'selected':''}>Morado</option></select></div><button class="btn" data-action="saveSettings">Guardar ajustes</button></div><div class="card stack"><h3>Datos y seguridad</h3><p class="muted">Los datos se guardan solamente en este navegador. Se recomienda exportar un respaldo después de cada cambio importante.</p><button class="btn alt" data-action="export">Exportar respaldo JSON</button><button class="btn alt" data-action="import">Importar respaldo JSON</button><button class="btn danger" data-action="reset">Eliminar todos los datos</button></div><div class="card"><h3>Información sobre cálculos</h3><p class="muted">Base orientativa: Ley Federal del Trabajo de México, arts. 76–81 y 87. Vacaciones mínimas desde 12 días anuales, prima mínima de 25% y aguinaldo mínimo de 15 días anuales. Las estimaciones pueden no corresponder a un caso laboral particular.</p></div>`}function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openEmployee(b.dataset.open));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action));const ao=document.getElementById('asof');if(ao)ao.onchange=()=>{asof=ao.value||today();render()};const s=document.getElementById('search');if(s)s.oninput=()=>{document.getElementById('employeeList').innerHTML=employeeRows(s.value);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openEmployee(b.dataset.open))};const se=document.getElementById('simEmployee');if(se)se.onchange=()=>{selected=se.value;render()}}document.getElementById('tabs').onclick=(ev)=>{let b=ev.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};document.getElementById('themeBtn').onclick=()=>{db.theme=db.theme==='dark'?'light':'dark';save();render()};function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modalback" id="back"><div class="modal"><div class="row"><h2>${content.title}</h2><button class="btn alt" id="closeModal">Cerrar ✕</button></div>${content.body}</div></div>`;document.getElementById('closeModal').onclick=close;document.getElementById('back').onclick=(ev)=>{if(ev.target.id==='back')close()}}function close(){document.getElementById('modalRoot').innerHTML=''}function editor(e){const fresh=!e;e=e||{name:'',job:'',start:today(),salary:'',period:'week',bonusDays:15,premium:25,mode:'regular',endDate:'',vacations:[],bonusPayments:[],history:[]};modal({title:fresh?'Nuevo empleado':'Editar empleado',body:`<form id="employeeForm" class="stack"><div class="grid"><div><label>Nombre *</label><input name="name" required value="${esc(e.name)}"></div><div><label>Puesto</label><input name="job" value="${esc(e.job)}"></div><div><label>Fecha de ingreso *</label><input type="date" name="start" required value="${e.start}"></div><div><label>Fecha de baja (opcional)</label><input type="date" name="endDate" value="${e.endDate||''}"></div><div><label>Sueldo *</label><input name="salary" type="number" min="0.01" step="0.01" required placeholder="Ej. 2500" value="${e.salary}"></div><div><label>Periodicidad</label><select name="period">${[['day','Diario'],['week','Semanal'],['fortnight','Quincenal'],['month','Mensual']].map(x=>`<option value="${x[0]}" ${e.period===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div><label>Días de aguinaldo al año</label><input name="bonusDays" type="number" min="15" step="0.5" value="${e.bonusDays||15}"></div><div><label>Prima vacacional (%)</label><input name="premium" type="number" min="25" step="1" value="${e.premium||25}"></div></div><div><label>Modalidad</label><select name="mode"><option value="regular" ${e.mode==='regular'?'selected':''}>Relación continua y salario fijo</option><option value="special" ${e.mode==='special'?'selected':''}>Jornada discontinua / salario variable (revisión manual necesaria)</option></select></div><div class="note">Los cálculos automáticos están diseñados para sueldos fijos con relación continua. Otras modalidades requieren revisión individual.</div><button class="btn" type="submit">Guardar empleado</button></form>`});document.getElementById('employeeForm').onsubmit=(ev)=>{ev.preventDefault();const f=new FormData(ev.target);const obj=Object.fromEntries(f.entries());if(obj.endDate&&obj.endDate<obj.start)return alert('La baja no puede ser anterior al ingreso.');const o={...e,...obj,salary:num(obj.salary),bonusDays:num(obj.bonusDays),premium:num(obj.premium)};if(o.salary<=0)return alert('Introduce un sueldo válido.');if(fresh){o.id=id();db.employees.push(o)}else {o.history=[...(e.history||[])];if(e.salary!==o.salary||e.period!==o.period)o.history.push({date:today(),salary:e.salary,period:e.period});db.employees=db.employees.map(x=>x.id===e.id?o:x)}save();close();tab='empleados';render()}}function openEmployee(key){selected=key;const e=getEmployee();if(!e)return;modal({title:esc(e.name),body:`<div class="stack"><div class="row wrap"><span class="pill ${e.endDate?'off':''}">${e.endDate?'Baja':'Activo'}</span><span class="muted">${esc(e.job||'Sin puesto')}</span></div><div class="grid"><div class="note">Ingreso<br><strong>${esc(e.start)}</strong></div><div class="note">Salario diario base<br><strong>${fmt(daily(e))}</strong></div><div class="note">Aguinaldo acumulado<br><strong>${fmt(aguinaldo(e,today()))}</strong></div><div class="note">Vacaciones disponibles (aprox.)<br><strong>${vacationLeft(e,today()).toFixed(2)} días</strong></div></div><div class="actions"><button class="btn alt" id="editE">Editar datos</button><button class="btn alt" id="addVacation">Registrar vacaciones</button><button class="btn alt" id="addPayment">Registrar aguinaldo pagado</button><button class="btn danger" id="deleteE">Eliminar</button></div><div class="line"></div><h3>Movimientos</h3>${[...(e.vacations||[]).map(x=>({date:x.date,msg:`Vacaciones utilizadas: ${x.days} días`})),...(e.bonusPayments||[]).map(x=>({date:x.date,msg:`Aguinaldo pagado: ${fmt(num(x.amount))}`}))].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="person"><strong>${esc(x.date)}</strong> · ${esc(x.msg)}</div>`).join('')||'<p class="muted">Sin movimientos.</p>'}<div class="note">Registra los pagos de aguinaldo realizados durante el año para descontarlos del pendiente.</div></div>`});document.getElementById('editE').onclick=()=>editor(e);document.getElementById('addVacation').onclick=()=>movement(e,'vacation');document.getElementById('addPayment').onclick=()=>movement(e,'payment');document.getElementById('deleteE').onclick=()=>{if(confirm('¿Eliminar permanentemente a '+e.name+' y todo su historial?')){db.employees=db.employees.filter(x=>x.id!==e.id);save();close();render()}}}function movement(e,type){const vac=type==='vacation';modal({title:vac?'Registrar vacaciones':'Registrar pago de aguinaldo',body:`<form id="movementForm" class="stack"><div><label>Fecha</label><input type="date" name="date" value="${today()}" required></div><div><label>${vac?'Días disfrutados':'Monto pagado (MXN)'}</label><input name="amount" type="number" min="0.01" step="${vac?'0.5':'0.01'}" required></div><button class="btn">Guardar movimiento</button></form>`});document.getElementById('movementForm').onsubmit=(ev)=>{ev.preventDefault();const fd=new FormData(ev.target),amount=num(fd.get('amount')),date=fd.get('date');if(!amount||date<e.start)return alert('Revisa la cantidad y la fecha.');if(vac){e.vacations=e.vacations||[];e.vacations.push({id:id(),date,days:amount})}else{e.bonusPayments=e.bonusPayments||[];e.bonusPayments.push({id:id(),date,amount})}save();openEmployee(e.id);render()}}function actions(action){if(action==='add')return editor();if(action==='saveSettings'){db.company=document.getElementById('company').value.trim()||'Mi negocio';db.theme=document.getElementById('theme').value;db.accent=document.getElementById('accent').value;save();render();alert('Ajustes guardados.')}if(action==='export'){const data=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download='personal-pro-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}if(action==='import')document.getElementById('importFile').click();if(action==='reset'&&confirm('¿Eliminar TODOS los empleados y registros? Esta acción no se puede deshacer.')&&confirm('Confirma nuevamente: ¿ya exportaste tu respaldo?')){db.employees=[];save();render()}if(action==='calc'){let e=getEmployee(),date=document.getElementById('simDate').value,pend=num(document.getElementById('pendingDays').value);if(!date||date<e.start)return alert('Fecha de salida inválida.');let bonus=Math.max(0,aguinaldo(e,date)-bonusPaid(e,date)),vDays=vacationLeft(e,date),vMoney=vDays*daily(e),premium=vMoney*num(e.premium||25)/100,wage=pend*daily(e),total=bonus+vMoney+premium+wage;document.getElementById('simResults').innerHTML=`<div class="line"></div><h3>Desglose estimado bruto</h3><div class="person row"><span>Salario pendiente</span><strong>${fmt(wage)}</strong></div><div class="person row"><span>Aguinaldo proporcional pendiente</span><strong>${fmt(bonus)}</strong></div><div class="person row"><span>Vacaciones pendientes (${vDays.toFixed(2)} días)</span><strong>${fmt(vMoney)}</strong></div><div class="person row"><span>Prima vacacional</span><strong>${fmt(premium)}</strong></div><div class="row"><strong>Total estimado</strong><strong class="big">${fmt(total)}</strong></div><p class="note">No incluye impuestos, prestaciones extraordinarias, adeudos adicionales ni indemnizaciones. Resultado orientativo, no monto definitivo de finiquito.</p><button class="btn alt" onclick="window.print()">Imprimir resumen</button>`}}document.getElementById('importFile').onchange=async function(){const file=this.files[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.employees)||incoming.employees.some(e=>typeof e.name!=='string'||typeof e.start!=='string'||!e.id))throw Error('Formato inválido');if(confirm('¿Reemplazar los registros actuales con este respaldo?')){db={...db,...incoming,employees:incoming.employees};save();render();alert('Respaldo restaurado.')}}catch(e){alert('No se pudo importar: '+e.message)}this.value=''};render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
